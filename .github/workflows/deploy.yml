name: Deploy

# Builds the image, pushes to ECR, runs migrations, and rolls out to EKS.
# Requires repo secrets: AWS_DEPLOY_ROLE_ARN (OIDC role).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-career-coach
  EKS_CLUSTER: career-coach
  NAMESPACE: career-coach

permissions:
  id-token: write   # for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Run migrations
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n "$NAMESPACE" delete job migrate --ignore-not-found
          kubectl -n "$NAMESPACE" apply -f deploy/k8s/60-migrate-job.yaml
          kubectl -n "$NAMESPACE" set image job/migrate migrate="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" || true
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/migrate --timeout=180s

      - name: Roll out
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n "$NAMESPACE" set image deployment/api api="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl -n "$NAMESPACE" set image deployment/worker worker="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/worker --timeout=180s
