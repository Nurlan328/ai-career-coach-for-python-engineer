apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: career-coach
  labels:
    app: career-coach
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: career-coach
      component: api
  template:
    metadata:
      labels:
        app: career-coach
        component: api
    spec:
      containers:
        - name: api
          # Replace with your ECR image; CI updates the tag on deploy.
          image: ACCOUNT.dkr.ecr.REGION.amazonaws.com/ai-career-coach:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: career-coach-config
            - secretRef:
                name: career-coach-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: career-coach
spec:
  type: ClusterIP
  selector:
    app: career-coach
    component: api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: career-coach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
